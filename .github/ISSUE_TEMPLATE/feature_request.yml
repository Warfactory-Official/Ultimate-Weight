name: 💡 Feature request
description: Suggest a new mechanic, config option, or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for weight, stamina, penalties, HUD, or the developer API? Tell us about it.
        For "please support mod X", use the **Mod compatibility** template instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and this hasn't been requested.
          required: true
        - label: This isn't already configurable (I checked CONFIGURATION.md).
          required: false

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation or annoyance. Focus on the "why" before the "what".
      placeholder: There's no way to exempt certain items (e.g. quest items) from counting toward weight.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A new config key, mechanic, HUD element, API hook…
      placeholder: A `weightlessTags`/`weightlessItems` config list whose entries always count as 0 weight.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Which area is this about?
      multiple: true
      options:
        - "Weight calculation"
        - "Stamina"
        - "Movement / jump penalties"
        - "Hard-lock / transfer blocking"
        - "HUD / tooltip"
        - "Config / server sync"
        - "Developer API (@CompatPlugin / KubeJS)"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Which version(s) should this target?
      multiple: true
      options:
        - "All versions"
        - "1.12.2 — Forge (Legacy)"
        - "1.20.1 — Forge"
        - "1.20.1 — Fabric"
        - "1.21.1 — NeoForge"
        - "1.21.1 — LexForge"
        - "1.21.1 — Fabric"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or how you work around this today.
    validations:
      required: false
