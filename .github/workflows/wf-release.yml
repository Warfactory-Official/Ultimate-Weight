name: WF Rolling Release

on:
  push:
    tags: ['wf']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wf-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build 1.20.1 Forge
        run: |
          chmod +x ./gradlew
          ./gradlew :1.20.1:forge:build -PmodVersion=1.2.0 --no-daemon

      - name: Stage jar
        run: |
          set -euo pipefail
          # The forge build emits three jars: the reobf *shadow* jar (bundles relocated
          # snakeyaml/fastutil/caffeine, ~26MB), plus thin `-dev` and `-sources` jars. Only the
          # shadow jar is runnable - the `-dev` jar references the UNrelocated org.yaml.snakeyaml.*
          # and bundles no deps, so it NoClassDefFoundErrors on org/yaml/snakeyaml/Yaml at load.
          # `! -name '*-sources*'` alone left `-dev` as a candidate and `head -1` picked it
          # nondeterministically, shipping the broken jar to fresh installs. Exclude every thin
          # classifier explicitly and select deterministically.
          SRC=$(find versions/1.20.1/forge/build/libs -maxdepth 1 -name 'wfweight-1.20.1-Forge-*.jar' \
            ! -name '*-sources*' ! -name '*-dev*' ! -name '*-slim*' | sort | head -1)
          if [ -z "$SRC" ]; then
            echo "No release jar found in versions/1.20.1/forge/build/libs" >&2
            ls -la versions/1.20.1/forge/build/libs >&2 || true
            exit 1
          fi
          echo "Staging $SRC"
          # Guard: the release jar MUST bundle the relocated SnakeYAML. If this ever fails we picked
          # a thin jar again - fail the release loudly instead of publishing a crash-on-launch jar.
          if ! unzip -l "$SRC" | grep -q 'ultimateweight/wfweight/shadow/org/yaml/snakeyaml/Yaml.class'; then
            echo "Staged jar '$SRC' is missing shaded SnakeYAML (thin jar). Refusing to publish." >&2
            exit 1
          fi
          cp "$SRC" wfweight.jar

      - name: Publish wf release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete wf --yes --cleanup-tag || true
          gh release create wf wfweight.jar \
            --title "WF rolling release" \
            --notes "Rolling pack release. Triggered by wf tag." \
            --latest
