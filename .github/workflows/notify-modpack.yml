name: Notify modpack

# When this WF-suite mod publishes a release, ping the warfactory-lite modpack
# to run its chained rebuild (see warfactory-lite/.github/workflows/rebuild.yml).
# Requires repo secret MODPACK_DISPATCH_TOKEN: a PAT (fine-grained, scoped to
# Warfactory-Official/warfactory-lite with Contents: Read and write) allowed to
# POST repository dispatches.

on:
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger warfactory-lite rebuild
        env:
          TOKEN: ${{ secrets.MODPACK_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::MODPACK_DISPATCH_TOKEN not set - skipping modpack rebuild trigger"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Warfactory-Official/warfactory-lite/dispatches \
            -d "{\"event_type\":\"wf-mod-updated\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"tag\":\"${GITHUB_REF_NAME}\"}}"
          echo "Dispatched wf-mod-updated to warfactory-lite"
